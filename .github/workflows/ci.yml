name: CI

# o-browser n'a pas de tests → smoke d'installation et d'import, sur les DEUX
# paquets du repo : le client (`o_browser`) et l'adaptateur de site
# (`adapters/vivatech`), qui importe `BrowserClient` depuis le premier.
# Ce que ce job attrape vraiment :
#   - une erreur de syntaxe dans n'importe quel module du client (client, _mixin,
#     har, remote sont tous chargés par l'import du package) ;
#   - un import relatif mort après un déplacement de fichier ;
#   - un symbole public retiré du `__init__` — les consommateurs (oto-backend,
#     oto-cli, les adaptateurs) importent `BrowserClient` / `RemoteBrowser` ;
#   - une conf de packaging hatchling cassée : `pip install .` construit la wheel,
#     donc le même défaut qui ferait échouer la publication PyPI au tag se voit ici.
# patchright n'est importé qu'à l'usage (dans les méthodes) : aucun navigateur à
# télécharger pour ce job.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10" # le plancher déclaré par requires-python
          cache: pip
      - name: Install (le client, avec ses deps)
        run: pip install .
      # --no-deps volontaire : l'adaptateur déclare `o-browser>=0.3.0` et on veut
      # qu'il soit testé contre le client DE CETTE BRANCHE, pas celui de PyPI.
      - name: Install (l'adaptateur de site, contre le client local)
        run: pip install --no-deps ./adapters/vivatech
      - name: Smoke (les deux paquets s'importent, symboles publics présents)
        run: |
          python -c "import o_browser; assert o_browser.BrowserClient and o_browser.RemoteBrowser; print('o_browser OK')"
          python -c "import o_browser_vivatech as m; assert m.VivaTechClient; print('o_browser_vivatech OK')"
